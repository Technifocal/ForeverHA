[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forever-ha-bridge"
version = "0.1.0"
description = "Read-only WoW Forever file bridge for Home Assistant"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["websockets>=14,<18", "tzdata>=2025.1; sys_platform == 'win32'"]

[project.scripts]
forever-ha = "forever_ha_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["forever_ha_bridge*"]
namespaces = false
